# Builds from this folder. To pull the image GitHub builds instead, use docker-compose.ghcr.yml.
# Synology Container Manager: Project > Create, point it at this folder.
services:
  lore-time:
    build: .
    image: lore-time:latest
    container_name: lore-time
    restart: unless-stopped
    ports:
      - "8090:8090"         # change the left side if 8090 is taken on your NAS
    environment:
      TZ: Etc/UTC
      # PUID: 1026          # optional: a DSM user that can read a mounted stories folder (`id <user>` over SSH)
      # PGID: "100"
      # Character names for stories written with placeholders such as {{hero}} (see the README).
      # Set here, real names stay on the NAS and out of the repository and the image.
      # NAME_HERO: Sam
      # NAME_SIDEKICK: Leo
    # The stories are built into the image. To serve a folder on the NAS instead (e.g. to try new
    # stories before pushing them), uncomment these two lines and put one folder per topic in ./stories.
    # volumes:
    #   - ./stories:/stories:ro
