# Pulls the image GitHub Actions builds (no build on the NAS).
# Synology Container Manager: Project > Create, choose a folder, and paste this file as docker-compose.yml.
services:
  lore-time:
    image: ghcr.io/3willie/lore-time:latest
    container_name: lore-time
    restart: unless-stopped
    ports:
      - "8090:8090"         # change the left side if 8090 is taken on your NAS
    environment:
      TZ: Etc/UTC
      # PUID: 1026          # optional: a DSM user that can read a mounted stories folder (`id <user>` over SSH)
      # PGID: "100"
    # The stories are built into the image. To serve a folder on the NAS instead (e.g. to try new
    # stories before pushing them), uncomment these two lines and put one folder per topic in ./stories.
    # volumes:
    #   - ./stories:/stories:ro
